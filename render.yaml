services:
  - type: web
    name: brand-store
    runtime: ruby
    plan: free

    buildCommand: ./bin/render-build.sh
    startCommand: RAILS_ENV=production bin/rails server -b 0.0.0.0 -p $PORT

    envVars:
      - key: RAILS_ENV
        value: production

      - key: RAILS_MASTER_KEY
        sync: false
